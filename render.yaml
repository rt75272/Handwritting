services:
  - type: web
    name: character-recognition-app
    env: python
    buildCommand: pip install -r requirements_production.txt
    startCommand: gunicorn app_production:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --preload
    plan: starter
    region: oregon
    branch: main
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000
      - key: FLASK_ENV
        value: production
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"