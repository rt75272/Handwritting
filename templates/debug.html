<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Canvas Drawing Debug</title>
		<link rel="stylesheet" href="{{ url_for('static', filename='css/debug.css') }}">
	</head>
	<body>
		<div class="container">
			<h1>🔍 Canvas Drawing Debug</h1>
			<p class="subtitle">Debug interface for testing canvas drawing functionality</p>
			
			<div class="canvas-container">
				<canvas id="canvas" width="280" height="280"></canvas>
			</div>
			
			<div class="button-container">
				<button onclick="testDraw()">🧪 Test Draw</button>
				<button onclick="clearCanvas()">🗑️ Clear</button>
				<button onclick="checkCanvas()">🔍 Check Canvas</button>
				<button onclick="predictDigit()">🔮 Predict</button>
			</div>
			
			<div class="debug">
				<strong>Debug Info:</strong>
				<pre id="debug-info">Ready...</pre>
			</div>
			
			<div id="result"></div>
			
			<div class="navigation">
				<a href="/"><button class="nav-btn">🏠 Main App</button></a>
				<a href="/admin"><button class="nav-btn">⚙️ Admin</button></a>
			</div>
		</div>
		<script src="{{ url_for('static', filename='js/debug.js') }}"></script>
	</body>
</html>
