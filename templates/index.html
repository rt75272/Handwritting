<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>AI Digit Recognition</title>
		<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
	</head>
	<body>
		<div class="container">
			<h1>AI Digit Recognition</h1>
			<p class="subtitle">Draw any digit (0-9) and let AI predict what you wrote!</p>
			<div class="instructions">
				💡 <strong>Tip:</strong> Draw clearly in the center of the canvas for best results
			</div>
			<div class="canvas-container">
				<canvas id="canvas" width="280" height="280"></canvas>
			</div>
			<div class="button-container">
				<button onclick="predictDigit()">Predict</button>
				<button class="clear-btn" onclick="clearCanvas()">Clear</button>
			</div>
			<div id="result"></div>
		</div>
		<script src="{{ url_for('static', filename='js/script.js') }}"></script>
	</body>
</html>
